# Publishes to npm via trusted publishing (OIDC): no npm token is stored in
# the repo. Requires the tod-ai package on npmjs.com to have a trusted
# publisher configured for this repository, this workflow file, and the
# "release" environment. The first release must be published manually;
# configure the trusted publisher after.
#
# Actions are pinned to commit SHAs and the toolchain to exact versions, so a
# moved tag or a compromised "latest" cannot alter what gets published.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in repo settings to
    # make every publish need a manual approval.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@12.0.2
      - run: bun install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match package.json version $version"
            exit 1
          fi
      # prepublishOnly runs the checks and the node-target build. Provenance
      # is attached automatically when publishing via trusted publishing.
      - run: npm publish
